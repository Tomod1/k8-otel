extensions:
  health_check:
    endpoint: 0.0.0.0:13133   # used by the k8s liveness/readiness probes
  zpages:
    endpoint: 0.0.0.0:55679   # live debug pages (/debug/pipelinez)

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Must be first: refuses data before the pod runs out of memory and gets OOM-killed
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  # Prints to pod logs. Swap for a real backend (otlp/otlphttp to Tempo, Jaeger, Grafana Cloud, etc.)
  debug:
    verbosity: basic

service:
  extensions: [health_check, zpages]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
